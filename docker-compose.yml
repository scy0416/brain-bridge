services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull ${LLM_MODEL}
        ollama pull ${EMBEDDING_MODEL}
        echo "==> LLM 웜업"
        ollama run ${LLM_MODEL} "hi"
        echo "==> 임베딩 웜업"
        ollama run ${EMBEDDING_MODEL} "hi" || true
        echo "==> 웜업 완료"
    restart: "no"
  
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MCP_SERVER_URL=http://mcp-server:8100/mcp
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      mcp-server:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src"]
  
  graph-init:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: ["bash", "scripts/load-graph.sh"]
    restart: "no"
  
  docs-init:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - OLLAMA_HOST=${OLLAMA_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: ["python", "scripts/load_documents.py"]
    restart: "no"

  mcp-server:
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8100
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      graph-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8100:8100"
    command: ["python", "src/api/mcp_server.py"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      app:
        condition: service_started
    environment:
      - OPENAI_API_BASE_URL=http://app:8000/v1
      - OPENAI_API_KEY=${OPEN_WEBUI_API_KEY:-sk-dummy-local-key}
      - ENABLE_OLLAMA_API=false
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - ENABLE_FOLLOW_UP_GENERATION=false
      - WEBUI_AUTH=False
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"

volumes:
  pgdata:
  ollama_data:
  open_webui_data: